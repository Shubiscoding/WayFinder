[package]
name = "way_finder"
version = "0.1.0"
edition = "2024"

[dependencies]
walkdir = "2"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-drag = "2.1.1"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.0", features = ["bundled"] }
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
# ^ Phase 4 (converter): pure-Rust image engine. Default features kept off to prevent bloat.
notify-debouncer-mini = "0.4"
fuzzy-matcher = "0.3.7"
# ^ Phase 5: real-time file watcher with debouncing, and fuzzy candidate matching.

[build-dependencies]
tauri-build = { version = "2", features = [] }
